<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Task 2 - Recipes</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-4">
      <h1>Task 2 - Recipes</h1>

      <form class="row g-3 align-items-end">
        <div class="col-sm">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control" id="name" name="name" />
        </div>

        <div class="col-sm">
          <label for="cuisine" class="form-label">Cuisine</label>
          <select class="form-select" id="cuisine" name="cuisine">
            <option value="">Select cuisine</option>
          </select>
        </div>

        <div class="col-sm">
          <label for="difficulty" class="form-label">Difficulty</label>
          <select class="form-select" id="difficulty" name="difficulty">
            <option value="">Select difficulty</option>
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
          </select>
        </div>

        <div class="col-sm">
          <label for="preparationTime" class="form-label"
            >Preparation time: <span id="timeValue">60</span> minutes</label
          >
          <input
            type="range"
            class="form-control"
            id="preparationTime"
            name="preparationTime"
            min="0"
            max="60"
            value="60"
          />
        </div>

        <div class="col-sm">
          <button type="reset" class="btn btn-primary mt-4">Reset</button>
        </div>
      </form>
      <p class="mb-3 mt-3">Current table contains of <span id="recipeCount">10</span> recipes</p>

      <table class="table table-striped table-bordered">
        <thead>
          <tr>
            <th>Name</th>
            <th>Cuisine</th>
            <th>Difficulty</th>
            <th>Preparation time</th>
            <th>Rating</th>
          </tr>
        </thead>

        <tbody></tbody>
      </table>

      <h2>Raw data from Recipes API</h2>

      <pre id="apiData"></pre>
    </div>

    <script src="script.js"></script>
  </body>
</html>
